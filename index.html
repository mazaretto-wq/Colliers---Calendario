<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colliers — Calendario de Marketing</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Open Sans',Verdana,sans-serif}
:root{
  --c-deep:#000759;--c-dark:#25408F;--c-medium:#1C54F4;--c-light:#4D93FF;--c-pale:#C3E6FF;
  --c-dbg:#353E59;--c-dg:#56648F;--c-mg:#7B8BBD;--c-lg:#ACBBE8;--c-pbg:#DBE5FF;
  --c-yellow:#FFD400;--c-red:#ED1B34;--c-teal:#2AB6A9;--c-white:#FFFFFF;--c-grey:#CCCDD5;
  --c-bg:#F4F6FB;
}
body{background:var(--c-bg);min-height:100vh}
.app{max-width:980px;margin:0 auto;background:var(--c-white);min-height:100vh;box-shadow:0 0 24px rgba(0,7,89,0.08)}
.brand-header{background:var(--c-dark);padding:12px 20px;display:flex;align-items:center;gap:10px}
.brand-accent{width:28px;height:3px;background:var(--c-yellow)}
.brand-logo{height:36px;width:auto;display:block;flex-shrink:0}
@media(max-width:600px){.brand-logo{height:28px}}
.brand-title{color:var(--c-white);font-size:15px;font-weight:700;letter-spacing:0.3px}
.brand-sub{color:var(--c-lg);font-size:12px;font-weight:400;margin-left:auto}
.main{padding:1.25rem 1.5rem}
.tabs{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:2px solid var(--c-pbg)}
.tab{padding:9px 20px;font-size:12px;font-weight:700;cursor:pointer;border:none;background:none;color:var(--c-mg);border-bottom:3px solid transparent;margin-bottom:-2px;letter-spacing:0.5px;text-transform:uppercase}
.tab.active{color:var(--c-dark);border-bottom:3px solid var(--c-medium)}
.tab:hover{color:var(--c-dark)}
.nav-row{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem}
.nav-row h2{font-size:17px;font-weight:700;flex:1;text-align:center;color:var(--c-deep)}
.nav-btn{background:none;border:1.5px solid var(--c-lg);border-radius:2px;padding:5px 14px;cursor:pointer;font-size:15px;color:var(--c-dark);font-weight:700}
.nav-btn:hover{background:var(--c-pbg);border-color:var(--c-medium)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.25rem}
.stat-card{background:var(--c-pbg);border-left:3px solid var(--c-medium);border-radius:2px;padding:12px 14px}
.stat-label{font-size:10px;font-weight:700;color:var(--c-dg);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:5px}
.stat-val{font-size:24px;font-weight:700;color:var(--c-deep)}
.stat-sub{font-size:11px;color:var(--c-mg);margin-top:2px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:1.5rem}
.cal-header{text-align:center;font-size:10px;font-weight:700;color:var(--c-dark);padding:5px;text-transform:uppercase;letter-spacing:0.6px}
.cal-day{border:1px solid var(--c-pbg);border-radius:2px;min-height:78px;padding:5px;cursor:pointer;background:var(--c-white);position:relative;transition:border-color 0.15s}
.cal-day:hover{border-color:var(--c-medium);background:var(--c-pbg)}
.cal-day.empty{background:none;border:none;cursor:default}
.cal-day.weekend{background:#F8FAFF}
/* Feriado: va antes que today/selected/overdue para que esos ganen el borde */
.cal-day.feriado{background:#E9EAEF;border-color:#D6D8E2}
.cal-day.feriado:hover{background:#DFE1E9;border-color:var(--c-mg)}
.holiday-name{font-size:8px;font-weight:700;color:var(--c-dg);line-height:1.15;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feriado-badge{font-size:10px;font-weight:700;color:var(--c-dg);background:#E9EAEF;border-radius:2px;padding:2px 7px;margin-left:8px;text-transform:none;letter-spacing:0;vertical-align:middle}
.cal-day.today{border:2px solid var(--c-medium)}
.cal-day.selected{border:2px solid var(--c-dark);background:var(--c-pbg)}
/* Día ya pasado con contenido sin confirmar */
.cal-day.overdue{border:2px solid var(--c-red);background:rgba(237,27,52,0.07)}
.cal-day.overdue:hover{border-color:var(--c-red);background:rgba(237,27,52,0.15)}
.cal-day.overdue.selected{border-color:var(--c-red);background:rgba(237,27,52,0.18);box-shadow:inset 0 0 0 2px var(--c-dark)}
.overdue-flag{position:absolute;top:3px;right:4px;font-size:9px;font-weight:700;color:var(--c-red);line-height:1;letter-spacing:0.2px}
.day-num{font-size:11px;font-weight:700;color:var(--c-dg);margin-bottom:3px}
.day-tags{display:flex;flex-wrap:wrap;gap:2px}
.tag{font-size:8px;padding:1px 5px;border-radius:1px;font-weight:700;letter-spacing:0.2px;white-space:nowrap}
.tag-ig{background:#1C54F4;color:#fff}
.tag-em{background:#2AB6A9;color:#fff}
.tag-li{background:#25408F;color:#fff}
.tag-fb{background:#4D93FF;color:#fff}
.tag-event{background:#FFD400;color:#000759}
.btn-add-event{background:var(--c-yellow);color:var(--c-deep);border:none;border-radius:2px;padding:7px 14px;font-size:11px;cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;font-family:'Open Sans',Verdana,sans-serif}
.btn-add-event:hover{background:#e5bc00}
.event-card{background:rgba(255,212,0,0.10);border:1px solid rgba(255,212,0,0.35);border-left:3px solid #FFD400;border-radius:4px;padding:8px 10px;margin-bottom:6px;display:flex;align-items:flex-start;gap:8px}
.event-card-title{font-size:13px;font-weight:700;color:var(--c-deep)}
.event-card-title.done{text-decoration:line-through;color:var(--c-mg)}
.form-row input[type=text]{width:100%;font-size:13px;border-radius:2px;border:1.5px solid var(--c-lg);padding:7px 9px;background:var(--c-white);color:var(--c-deep);font-family:'Open Sans',Verdana,sans-serif}
.form-row input[type=text]:focus{outline:none;border-color:var(--c-medium)}
body.dark .event-card{background:rgba(255,212,0,0.06);border-color:rgba(255,212,0,0.2);border-left-color:#FFD400}
body.dark .event-card-title{color:#e6edf3}
body.dark .form-row input[type=text]{background:#0d1117;color:#e6edf3;border-color:#30363d}
body.dark .form-row input[type=text]:focus{border-color:var(--c-medium)}

.tag-done{background:#ACBBE8;color:#000759;text-decoration:line-through}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,7,89,0.45);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:var(--c-white);border-radius:4px;border-top:4px solid var(--c-medium);padding:1.5rem;width:380px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-title{font-size:13px;font-weight:700;color:var(--c-deep);margin-bottom:1.25rem;text-transform:uppercase;letter-spacing:0.4px;display:flex;justify-content:space-between;align-items:center}
.modal-date{font-size:12px;color:var(--c-mg);font-weight:400;text-transform:none;letter-spacing:0}
.modal-feriado{color:var(--c-red);font-weight:700}
/* ── EXPORTAR ── */
.btn-export{background:none;border:1.5px solid var(--c-lg);border-radius:2px;padding:5px 12px;cursor:pointer;font-size:11px;font-weight:700;color:var(--c-dark);font-family:'Open Sans',Verdana,sans-serif;text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap}
.btn-export:hover{background:var(--c-pbg);border-color:var(--c-medium)}
.modal-wide{width:680px}
.exp-yearnav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.exp-yearnav .nav-btn{padding:2px 10px;font-size:13px}
.exp-year{font-size:13px;font-weight:700;color:var(--c-deep);min-width:46px;text-align:center}
.exp-mini{background:none;border:1.5px solid var(--c-lg);border-radius:2px;padding:4px 10px;font-size:10px;font-weight:700;color:var(--c-dg);cursor:pointer;font-family:'Open Sans',Verdana,sans-serif}
.exp-mini:hover{border-color:var(--c-medium);color:var(--c-medium)}
.exp-mini:last-child{margin-left:auto}
.exp-meses{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.exp-mes{background:none;border:1.5px solid var(--c-lg);border-radius:3px;padding:7px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Open Sans',Verdana,sans-serif}
.exp-mes:hover{border-color:var(--c-medium)}
.exp-mes.on{background:var(--c-dark);border-color:var(--c-dark)}
.exp-mes-n{font-size:11px;font-weight:700;color:var(--c-deep);text-transform:uppercase;letter-spacing:0.3px}
.exp-mes-c{font-size:9px;color:var(--c-mg)}
.exp-mes.on .exp-mes-n,.exp-mes.on .exp-mes-c{color:#fff}
.exp-hint{font-size:10px;color:var(--c-mg);margin-top:8px;line-height:1.4}
.exp-preview{max-height:230px;overflow-y:auto;border:1.5px solid var(--c-pbg);border-radius:3px;padding:10px 12px;background:var(--c-bg)}
.exp-resumen{font-size:11px;font-weight:700;color:var(--c-dg);margin-bottom:10px}
.exp-area{margin-bottom:12px}
.exp-area-title{display:flex;align-items:center;gap:7px;border-bottom:2px solid var(--c-pbg);padding-bottom:4px;margin-bottom:2px}
.exp-area-name{font-size:11px;font-weight:700;color:var(--c-deep);text-transform:uppercase;letter-spacing:0.4px}
.exp-fila{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px solid var(--c-pbg)}
.exp-fila:last-child{border-bottom:none}
.exp-fecha{font-size:10px;font-weight:700;color:var(--c-medium);width:66px;flex-shrink:0;padding-top:1px}
.exp-cuerpo{flex:1;min-width:0}
.exp-tema{font-size:12px;font-weight:600;color:var(--c-deep)}
.exp-meta{font-size:10px;color:var(--c-mg);margin-top:2px}
.modal-close{background:none;border:none;cursor:pointer;font-size:18px;color:var(--c-mg);line-height:1}
.modal-close:hover{color:var(--c-red)}
.form-row{margin-bottom:12px}
.form-row label{font-size:10px;font-weight:700;color:var(--c-dg);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
.form-row select,.form-row textarea{width:100%;font-size:13px;border-radius:2px;border:1.5px solid var(--c-lg);padding:7px 9px;background:var(--c-white);color:var(--c-deep);font-family:'Open Sans',Verdana,sans-serif}
.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--c-medium)}
.form-row textarea{resize:vertical;min-height:56px}
.form-check{display:flex;align-items:center;gap:8px;margin-top:4px}
.form-check input{width:16px;height:16px;cursor:pointer;accent-color:var(--c-teal)}
.form-check label{font-size:13px;color:var(--c-deep);font-weight:400;text-transform:none;letter-spacing:0}
.btn-row{display:flex;gap:8px;margin-top:16px}
.btn-primary{background:var(--c-dark);color:var(--c-white);border:none;border-radius:2px;padding:9px 16px;font-size:12px;cursor:pointer;font-weight:700;flex:1;letter-spacing:0.3px;text-transform:uppercase;font-family:'Open Sans',Verdana,sans-serif}
.btn-primary:hover{background:var(--c-deep)}
.btn-secondary{background:none;border:1.5px solid var(--c-lg);border-radius:2px;padding:9px 14px;font-size:12px;cursor:pointer;color:var(--c-mg);font-family:'Open Sans',Verdana,sans-serif;font-weight:600}
.btn-secondary:hover{background:#FDECEA;color:var(--c-red);border-color:var(--c-red)}
.content-list{margin-top:4px}
.content-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--c-pbg)}
.content-item:last-child{border-bottom:none}
.check-btn{width:20px;height:20px;min-width:20px;border-radius:1px;border:1.5px solid var(--c-lg);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px}
.check-btn.done{background:var(--c-teal);border-color:var(--c-teal);color:white}
.item-info{flex:1;min-width:0}
.item-title{font-size:13px;font-weight:600;color:var(--c-deep)}
.item-title.done{text-decoration:line-through;color:var(--c-mg)}
.item-badges{display:flex;gap:4px;flex-wrap:wrap;margin:3px 0}
.badge{font-size:9px;padding:2px 6px;border-radius:1px;font-weight:700;letter-spacing:0.2px}
.badge-area{background:var(--c-pbg);color:var(--c-dark)}
.badge-canal{color:#fff}
.badge-resp{background:#F0F0F8;color:var(--c-dbg);border:1px solid var(--c-pbg)}
.item-meta{font-size:11px;color:var(--c-mg);margin-top:2px}
.item-no-tema{background:none;border:none;padding:0;font-family:'Open Sans',Verdana,sans-serif;font-size:13px;font-weight:600;font-style:italic;color:var(--c-mg);cursor:pointer;text-align:left}
.item-no-tema:hover{color:var(--c-medium);text-decoration:underline}
.del-btn{background:none;border:none;cursor:pointer;color:var(--c-grey);font-size:14px;padding:2px 4px;margin-top:1px;line-height:1}
.del-btn:hover{color:var(--c-red)}
.edit-btn{background:none;border:none;cursor:pointer;color:var(--c-grey);font-size:13px;padding:2px 4px;margin-top:1px;line-height:1}
.edit-btn:hover{color:var(--c-medium)}
.add-btn{position:absolute;bottom:3px;right:4px;background:none;border:none;color:var(--c-lg);cursor:pointer;font-size:15px;padding:1px;line-height:1}
.add-btn:hover{color:var(--c-medium)}
.section-title{font-size:12px;font-weight:700;color:var(--c-deep);margin-bottom:1rem;text-transform:uppercase;letter-spacing:0.5px;padding-bottom:6px;border-bottom:2px solid var(--c-pbg)}
.divider{border:none;border-top:2px solid var(--c-pbg);margin:1.25rem 0}
.detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.btn-add-detail{background:var(--c-dark);color:white;border:none;border-radius:2px;padding:7px 14px;font-size:11px;cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;font-family:'Open Sans',Verdana,sans-serif}
.btn-add-detail:hover{background:var(--c-deep)}
.empty-msg{font-size:12px;color:var(--c-mg);text-align:center;padding:1.5rem 0;font-style:italic}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:1rem}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--c-dg)}
.legend-dot{width:10px;height:10px;border-radius:1px}

/* ── COMPARTIR / LINKS / TOAST ── */
.btn-share{background:none;border:1.5px solid var(--c-dark);color:var(--c-dark);border-radius:2px;padding:7px 12px;font-size:11px;cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;font-family:'Open Sans',Verdana,sans-serif}
.btn-share:hover{background:var(--c-pbg)}
.share-btn{background:none;border:none;cursor:pointer;color:var(--c-grey);font-size:14px;padding:2px 4px;margin-top:1px;line-height:1}
.share-btn:hover{color:var(--c-teal)}
.item-link{display:inline-block;font-size:11px;font-weight:700;color:var(--c-medium);text-decoration:none;margin-top:3px;word-break:break-all}
.item-link:hover{text-decoration:underline}
/* ── TEMARIO ── */
.tem-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tem-input{font-size:12px;border-radius:2px;border:1.5px solid var(--c-lg);padding:7px 9px;background:var(--c-white);color:var(--c-deep);font-family:'Open Sans',Verdana,sans-serif}
.tem-input:focus{outline:none;border-color:var(--c-medium)}
.tem-search{flex:1;min-width:190px}
.tem-count{font-size:11px;color:var(--c-mg);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tem-active-tag{font-size:10px;font-weight:700;background:var(--c-medium);color:#fff;border:none;border-radius:10px;padding:3px 9px;cursor:pointer;font-family:'Open Sans',Verdana,sans-serif}
.tem-group{margin-bottom:16px}
.tem-g-title{display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:2px solid var(--c-pbg);margin-bottom:2px}
.tem-g-name{font-size:12px;font-weight:700;color:var(--c-deep);letter-spacing:0.2px}
.tem-g-count{font-size:10px;font-weight:700;color:var(--c-medium);background:var(--c-pbg);border-radius:10px;padding:2px 8px;flex-shrink:0}
.tem-sub-title{display:flex;align-items:center;gap:7px;padding:8px 0 3px 12px;border-bottom:1px dashed var(--c-pbg)}
.tem-sub-name{font-size:11px;font-weight:700;color:var(--c-dg)}
.tem-sub-count{font-size:9px;font-weight:700;color:var(--c-mg);background:var(--c-bg);border:1px solid var(--c-pbg);border-radius:9px;padding:1px 7px;flex-shrink:0}
.tem-sub-title+.tem-row{padding-left:12px}
.item-sub{font-size:11px;font-weight:600;color:var(--c-mg);margin-top:1px}
.tem-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--c-pbg)}
.tem-row:last-child{border-bottom:none}
.tem-date{font-size:10px;font-weight:700;color:var(--c-medium);background:none;border:none;cursor:pointer;padding:3px 0;width:86px;flex-shrink:0;text-align:left;font-family:'Open Sans',Verdana,sans-serif;letter-spacing:0.2px}
.tem-date:hover{text-decoration:underline}
.tem-body{flex:1;min-width:0}
.tem-tema{font-size:13px;font-weight:600;color:var(--c-deep)}
.tem-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tem-tag{font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--c-pbg);color:var(--c-dark);border:none;cursor:pointer;font-family:'Open Sans',Verdana,sans-serif}
.tem-tag:hover{background:var(--c-lg)}
.tem-tag.on{background:var(--c-medium);color:#fff}
.tem-state{font-size:9px;font-weight:700;padding:2px 7px;border-radius:1px;flex-shrink:0;margin-top:2px;letter-spacing:0.2px}
.tem-state.ok{background:rgba(42,182,169,0.16);color:#1d8177}
.tem-state.no{background:rgba(237,27,52,0.12);color:var(--c-red)}
.tem-trunc{font-size:10px;color:var(--c-mg);font-style:italic;padding:6px 0 0 96px}
.sug-wrap{position:relative}
.sug-box{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--c-white);border:1.5px solid var(--c-medium);border-top:none;border-radius:0 0 3px 3px;max-height:186px;overflow-y:auto;box-shadow:0 8px 20px rgba(0,7,89,0.14)}
.sug-item{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--c-pbg);padding:7px 9px;font-size:12px;color:var(--c-deep);cursor:pointer;font-family:'Open Sans',Verdana,sans-serif}
.sug-item:last-child{border-bottom:none}
.sug-item:hover,.sug-item.on{background:var(--c-pbg)}
.dup-warn{margin-top:6px;border:1px solid rgba(237,27,52,0.4);background:rgba(237,27,52,0.07);border-radius:3px;padding:7px 9px}
.dup-warn.info{border-color:rgba(28,84,244,0.35);background:rgba(28,84,244,0.06)}
.dup-warn-title{font-size:10px;font-weight:700;color:var(--c-red);margin-bottom:4px}
.dup-warn.info .dup-warn-title{color:var(--c-medium)}
.dup-warn-item{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;font-size:11px;color:var(--c-dark);padding:2px 0;font-family:'Open Sans',Verdana,sans-serif}
.dup-warn-item:hover{text-decoration:underline;color:var(--c-medium)}
.label-hint{font-weight:400;text-transform:none;letter-spacing:0;color:var(--c-mg)}
@media(max-width:600px){.tab{padding:9px 11px;font-size:11px}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);background:#000759;color:#fff;padding:10px 18px;border-radius:4px;font-size:12px;font-weight:600;z-index:400;opacity:0;pointer-events:none;transition:opacity 0.2s,transform 0.2s;box-shadow:0 6px 20px rgba(0,7,89,0.25);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── TOGGLE CHIPS ── */
.toggle-chips{display:flex;flex-wrap:wrap;gap:6px;padding:3px 0}
.toggle-chip{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--c-lg);background:none;color:var(--c-dg);font-family:'Open Sans',Verdana,sans-serif;letter-spacing:0.2px}
.toggle-chip:hover{border-color:var(--c-mg)}

/* ── FILTRO POR RESPONSABLE ── */
.dash-filtro{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--c-pbg)}
.dash-filtro.activo{background:var(--c-pbg);border-radius:4px;padding:10px 12px;border-bottom:none}
.filtro-quitar{background:var(--c-dark);color:#fff;border:none;border-radius:20px;padding:5px 12px;font-size:10px;font-weight:700;cursor:pointer;font-family:'Open Sans',Verdana,sans-serif;margin-left:auto;white-space:nowrap}
.filtro-quitar:hover{background:var(--c-red)}
.dash-filtro-lbl{font-size:10px;font-weight:700;color:var(--c-dg);text-transform:uppercase;letter-spacing:0.6px}

/* ── MODERN DASHBOARD ── */
.dash-hero{background:linear-gradient(135deg,#25408F 0%,#1C54F4 100%);border-radius:10px;padding:20px 24px;display:flex;align-items:center;gap:20px;margin-bottom:22px;box-shadow:0 4px 20px rgba(37,64,143,0.25)}
.dash-hero-ring{flex-shrink:0}
.dash-hero-info{flex:1}
.dash-hero-total{font-size:44px;font-weight:700;color:#fff;line-height:1}
.dash-hero-label{font-size:11px;color:rgba(255,255,255,0.65);margin-top:3px;text-transform:uppercase;letter-spacing:0.5px}
.dash-hero-pills{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.dash-hero-pill{background:rgba(255,255,255,0.15);border-radius:8px;padding:8px 14px;text-align:center;min-width:72px}
.dash-hero-pill-val{font-size:20px;font-weight:700;color:#fff}
.dash-hero-pill-label{font-size:10px;color:rgba(255,255,255,0.65);margin-top:1px}
.dash-section{margin-bottom:22px}
.dash-s-title{font-size:11px;font-weight:700;color:var(--c-mg);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:12px;display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--c-pbg)}
.dash-s-title::before{content:'';display:block;width:3px;height:14px;background:var(--c-medium);border-radius:2px;flex-shrink:0}
.area-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.area-bar-name{width:148px;font-size:11px;font-weight:600;color:var(--c-deep);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.area-bar-track{flex:1;background:var(--c-pbg);height:8px;border-radius:4px;overflow:hidden}
.area-bar-fill{height:8px;border-radius:4px;background:linear-gradient(90deg,#25408F,#1C54F4);transition:width 0.4s ease}
.area-bar-nums{width:84px;font-size:10px;color:var(--c-mg);text-align:right;flex-shrink:0}
.resp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:10px}
.resp-card{background:var(--c-white);border:1px solid var(--c-pbg);border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:12px;transition:box-shadow 0.15s}
.resp-card:hover{box-shadow:0 4px 14px rgba(37,64,143,0.1)}
.resp-av{width:42px;height:42px;border-radius:50%;color:white;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:0.5px}
.resp-body{flex:1;min-width:0}
.resp-name{font-size:12px;font-weight:700;color:var(--c-deep)}
.resp-count{font-size:26px;font-weight:700;color:var(--c-medium);line-height:1.1}
.resp-sub{font-size:10px;color:var(--c-mg);margin-top:1px}
.resp-mini-track{background:var(--c-pbg);height:3px;border-radius:2px;margin-top:6px;overflow:hidden}
.resp-mini-fill{height:3px;border-radius:2px;transition:width 0.4s}
.canal-grid{display:flex;flex-wrap:wrap;gap:8px}
.canal-chip{border-radius:8px;padding:12px 16px;color:white;display:flex;flex-direction:column;gap:3px;min-width:95px}
.canal-chip-name{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;opacity:0.85}
.canal-chip-total{font-size:28px;font-weight:700;line-height:1}
.canal-chip-done{font-size:10px;opacity:0.75}
.tipo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tipo-card{background:var(--c-bg);border:1px solid var(--c-pbg);border-radius:6px;padding:10px 12px}
.tipo-card-name{font-size:10px;font-weight:700;color:var(--c-dg);text-transform:uppercase;letter-spacing:0.4px}
.tipo-card-count{font-size:26px;font-weight:700;color:var(--c-deep);margin:4px 0;line-height:1}
.tipo-card-sub{font-size:10px;color:var(--c-mg)}
.tipo-card-bar{background:var(--c-pbg);height:3px;border-radius:2px;margin-top:7px;overflow:hidden}
.tipo-card-fill{height:3px;border-radius:2px;background:var(--c-yellow)}
.month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:4px}
.month-card2{background:var(--c-white);border:1px solid var(--c-pbg);border-top:3px solid var(--c-pbg);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all 0.15s}
.month-card2:hover{box-shadow:0 4px 16px rgba(37,64,143,0.12)}
.month-card2.has-data{border-top-color:var(--c-medium)}
.month-card2-name{font-size:11px;font-weight:700;color:var(--c-deep);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.month-card2-big{font-size:30px;font-weight:700;color:var(--c-dark);line-height:1}
.month-card2-sub{font-size:10px;color:var(--c-mg);margin-top:2px}
.month-card2-pct{font-size:11px;font-weight:700;color:var(--c-medium);margin-top:4px}
.month-prog{background:var(--c-pbg);height:4px;border-radius:2px;margin-top:8px;overflow:hidden}
.month-prog-fill{height:4px;border-radius:2px;background:linear-gradient(90deg,#25408F,#1C54F4)}

/* ── TRANSICIONES GLOBALES ── */
body,body *{transition:background-color 0.3s,color 0.3s,border-color 0.3s,box-shadow 0.3s}
/* Excluir transiciones que no deben animarse */
.area-bar-fill,.resp-mini-fill,.tipo-card-fill,.month-prog-fill,.prog-fill{transition:width 0.4s ease!important}

/* ── TOGGLE BUTTON ── */
.theme-btn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);color:white;border-radius:20px;padding:4px 12px;cursor:pointer;font-size:15px;margin-left:0;line-height:1.5;letter-spacing:0}
.theme-btn:hover{background:rgba(255,255,255,0.24)}

/* ── SELECTOR DE PAÍS ── */
.pais-switch{display:flex;gap:3px;margin-left:auto;background:rgba(255,255,255,0.10);border-radius:20px;padding:3px}
.pais-btn{background:none;border:none;color:rgba(255,255,255,0.7);border-radius:16px;padding:5px 13px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Open Sans',Verdana,sans-serif;letter-spacing:0.3px;white-space:nowrap;line-height:1.4}
.pais-btn:hover{color:#fff;background:rgba(255,255,255,0.10)}
.pais-btn.active{background:var(--c-white);color:var(--c-dark)}
@media(max-width:600px){.pais-nombre{display:none}.brand-title{font-size:13px}}

/* ── MODO NOCHE ── */

  </div>
</div>

<script>
const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DAYS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DAYS_FULL=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const TIPOS=['Post','Story','Reel/Video','Infografía','Newsletter','Artículo','Otro'];
const AREAS=['Valuaciones','SPS','MKT','Research','Oficinas','Industrias','Retail','Informes de mercado','Consultorías'];
const CANALES=['IG','Email MKT','LinkedIn','Facebook','X','YouTube'];
const CANAL_COLORS={'IG':'tag-ig','Email MKT':'tag-em','LinkedIn':'tag-li','Facebook':'tag-fb','X':'tag-x','YouTube':'tag-yt'};
const CANAL_BG={'IG':'#1C54F4','Email MKT':'#2AB6A9','LinkedIn':'#25408F','Facebook':'#4D93FF','X':'#353E59','YouTube':'#FF0000'};
const RESPONSABLES=['Azaretto M.','Mendoza J.','Wolkowikz N.','Latorre I.'];
const RESP_COLORS=['#25408F','#1C54F4','#2AB6A9','#353E59'];

function getCanales(it){return Array.isArray(it.canales)?it.canales:(it.canal?[it.canal]:[]);}
function getResps(it){return Array.isArray(it.resps)?it.resps:(it.resp?[it.resp]:[]);}

/* ── LINKS DE CONTENIDO ──
   normalizeLink: agrega https:// si el usuario pega la URL sin protocolo.
   safeHref: sólo devuelve la URL si es http/https, si no devuelve '' (no se linkea). */
function normalizeLink(v){
  v=(v||'').trim();
  if(!v)return '';
  if(!/^[a-z][a-z0-9+.\-]*:/i.test(v))v='https://'+v;
  return safeHref(v);
}
function safeHref(v){
  v=(v||'').trim();
  if(!v)return '';
  try{
    const u=new URL(v);
    return(u.protocol==='http:'||u.protocol==='https:')?u.href:'';
  }catch(e){return ''}
}
// Para mostrar: tolera links guardados sin protocolo, pero nunca devuelve algo que no sea http/https
function hrefOf(v){return safeHref(v)||normalizeLink(v);}
function escAttr(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function linkAnchor(v){
  const href=hrefOf(v);
  if(!href)return null;
  const a=el('a','item-link','🔗 Ver contenido');
  a.href=href;a.target='_blank';a.rel='noopener noreferrer';
  a.title=href;
  a.onclick=(e)=>e.stopPropagation();
  return a;
}

/* ── TEMARIO: índice derivado del calendario ──
   No hay una segunda fuente de datos: todo sale de S.data, así que nada se
   carga dos veces ni se desincroniza. */
function allItems(){
  const out=[];
  Object.keys(S.data).forEach(k=>{
    const mt=k.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!mt)return;
    (S.data[k]||[]).forEach((it,idx)=>{
      if(it)out.push({k,y:+mt[1],m:+mt[2]-1,d:+mt[3],idx,it});
    });
  });
  return out.sort((a,b)=>a.k<b.k?1:(a.k>b.k?-1:a.idx-b.idx)); // más reciente primero
}
/* Tema "real": lo que se cargó como tema, el nombre del evento o la primera línea
   de la descripción. NO cae al tipo de contenido: "Post" o "Story" son formatos,
   no temas, y no tienen que ensuciar sugerencias, agrupaciones ni repetidos. */
function temaReal(it){
  if(it.tema&&it.tema.trim())return it.tema.trim();
  if(it.isEvent)return (it.nombre||'').trim();
  const d=(it.desc||'').trim();
  return d?d.split('\n')[0].slice(0,90):'';
}
// Para mostrar en una fila siempre hace falta algo: ahí sí se cae al tipo
function temaOf(it){return temaReal(it)||it.tipo||'Contenido'}
function subtemaOf(it){return (it.subtema||'').trim()}
function getTags(it){
  if(Array.isArray(it.tags))return it.tags.filter(t=>t&&String(t).trim());
  if(typeof it.tags==='string')return parseTags(it.tags);
  return [];
}
function parseTags(str){
  const seen=new Set(),out=[];
  (str||'').split(/[,;]+/).forEach(s=>{
    const t=s.trim().replace(/\s+/g,' ');
    if(!t)return;
    const l=t.toLowerCase();
    if(seen.has(l))return;
    seen.add(l);out.push(t);
  });
  return out.slice(0,12);
}
// Etiquetas sugeridas: se arman solas con lo ya cargado, no hay lista fija que mantener
/* Subtemas ya usados. Si se pasa un tema, primero los de ese tema:
   al cargar el subtema conviene ver qué se hizo dentro del mismo tema. */
function allSubtemas(tema){
  const t=norm(tema||''),propios=new Map(),otros=new Map();
  allItems().forEach(r=>{
    const s=subtemaOf(r.it),l=norm(s);
    if(!l)return;
    const dest=(t&&norm(temaReal(r.it))===t)?propios:otros;
    if(!dest.has(l))dest.set(l,s);
  });
  const orden=(m)=>[...m.values()].sort((a,b)=>a.localeCompare(b,'es'));
  return orden(propios).concat(orden(otros).filter(s=>!propios.has(norm(s))));
}
function allTags(){
  const seen=new Map();
  allItems().forEach(r=>getTags(r.it).forEach(t=>{
    const l=t.toLowerCase();
    if(!seen.has(l))seen.set(l,t);
  }));
  return [...seen.values()].sort((a,b)=>a.localeCompare(b,'es'));
}
// Sólo temas cargados a mano: ni tipos de contenido ni descripciones sueltas
function allTemas(){
  const seen=new Map();
  allItems().forEach(r=>{
    const t=(r.it.tema||'').trim(),l=norm(t);
    if(l&&!seen.has(l))seen.set(l,t);
  });
  return [...seen.values()].sort((a,b)=>a.localeCompare(b,'es'));
}

/* ── Búsqueda y detección de repetidos ── */
const STOPWORDS=new Set(['de','del','la','el','los','las','en','y','a','para','con','por','un','una','unos','unas','sobre','al','que','se','su','sus','lo','o','como','desde','entre','mas','más']);
function norm(s){
  return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function keyWords(s){return norm(s).split(' ').filter(w=>w.length>2&&!STOPWORDS.has(w))}
function similarity(a,b){
  const A=new Set(keyWords(a)),B=new Set(keyWords(b));
  if(!A.size||!B.size)return 0;
  let inter=0;
  A.forEach(w=>{if(B.has(w))inter++});
  return inter/Math.min(A.size,B.size);
}
function similarItems(text,exKey,exIdx,limit){
  if(keyWords(text).length<1)return [];
  return allItems()
    .map(r=>Object.assign({score:similarity(text,temaReal(r.it)+' '+getTags(r.it).join(' '))},r))
    .filter(r=>r.score>=0.5&&!(r.k===exKey&&r.idx===exIdx))
    .sort((a,b)=>b.score-a.score)
    .slice(0,limit||4);
}
function haystack(r){
  const it=r.it;
  return norm([temaOf(it),subtemaOf(it),it.desc,getTags(it).join(' '),it.area,it.tipo,
    getCanales(it).join(' '),getResps(it).join(' '),it.isEvent?'evento':''].join(' '));
}

/* ── PAÍSES ──
   Cada país tiene su propio nodo en Firebase, así que los calendarios son
   independientes: nada de lo cargado en uno aparece en el otro. Argentina
   conserva el nodo original 'calendar_data' para no migrar lo ya cargado.
   'resps' en null usa la lista general; si el equipo de un país es distinto,
   se pone acá su propia lista. */
const PAISES={
  ar:{nombre:'Argentina',flag:'🇦🇷',node:'calendar_data',resps:null},
  uy:{nombre:'Uruguay',flag:'🇺🇾',node:'calendar_data_uy',resps:null}
};
function pais(){return PAISES[S.pais]||PAISES.ar}
function RESPS(){return pais().resps||RESPONSABLES}
function respColor(r){
  const i=RESPS().indexOf(r);
  return RESP_COLORS[(i<0?0:i)%RESP_COLORS.length];
}

/* Renombres de responsables. Al cambiar un nombre en la lista, lo ya cargado
   queda con el nombre viejo y dejaría de contar en el filtro y en los
   dashboards, así que se reescribe una sola vez sobre los datos. Es
   idempotente: cuando ya no queda nada con el nombre viejo, no escribe nada. */
const RENOMBRES={'Morua C.':'Wolkowikz N.','Wolkowicz N.':'Wolkowikz N.'};
function migrarNombres(){
  if(!Object.keys(RENOMBRES).length)return 0;
  let cambios=0;
  Object.keys(S.data).forEach(k=>{
    (S.data[k]||[]).forEach(it=>{
      if(!it)return;
      const antes=getResps(it);
      if(!antes.length)return;
      const vistos=new Set(),despues=[];
      antes.forEach(r=>{
        const n=RENOMBRES[r]||r;
        if(!vistos.has(n)){vistos.add(n);despues.push(n)}
      });
      if(despues.join('|')===antes.join('|'))return;
      it.resps=despues;
      if(it.resp!==undefined)delete it.resp;   // formato viejo de un solo responsable
      cambios++;
    });
  });
  if(cambios)save(S.data);
  return cambios;
}

let dataRef=null;

// Se escucha sólo el nodo del país activo; al cambiar de país se corta la
// suscripción anterior y se vacían los datos para no mezclar calendarios.
function suscribir(){
  if(dataRef)dataRef.off();
  S.data={};
  dataRef=firebaseDb.ref(pais().node);
  dataRef.on('value',(snap)=>{S.data=snap.val()||{};migrarNombres();render()});
  render();
}
function setPais(p){
  if(!PAISES[p]||p===S.pais)return;
  S.pais=p;
  try{localStorage.setItem('colliers_pais',p)}catch(e){}
  S.showModal=false;S.editIdx=null;
  // Los temas, etiquetas y filtros son propios de cada país
  S.q='';S.fAnio='';S.fArea='';S.fCanal='';S.fTipo='';S.fEstado='';S.fTag='';S.temLimit=TEM_PAGE;
  S.fResp='';S.expMeses=[];S.expAreas=[];   // el equipo y lo cargado son de cada país
  suscribir();
}

function save(d){if(dataRef)dataRef.set(d||{})}

const today=new Date();
let S={view:'calendar',pais:'ar',year:today.getFullYear(),month:today.getMonth(),selectedDay:null,showModal:false,editIdx:null,eventMode:false,data:{},
  q:'',fAnio:'',fArea:'',fCanal:'',fTipo:'',fEstado:'',fTag:'',groupBy:'tema',temLimit:150,
  exportOpen:false,expYear:today.getFullYear(),expMeses:[],expAreas:[],fResp:''};
const TEM_PAGE=150;

function dayKey(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}

/* ── LINK DIRECTO (#pais/AAAA-MM-DD) ──
   El país va en el link para que un día compartido abra el calendario
   correcto. Se siguen aceptando los links viejos sin país, como Argentina. */
function dayUrl(y,m,d){
  return location.origin+location.pathname+location.search+'#'+S.pais+'/'+dayKey(y,m,d);
}
function temarioUrl(){
  return location.origin+location.pathname+location.search+'#'+S.pais+'/temario';
}
function applyHash(){
  let h=(location.hash||'').replace(/^#/,'');
  let cod=null;
  const mp=h.match(/^(ar|uy)(?:\/(.*))?$/i);
  if(mp){cod=mp[1].toLowerCase();h=mp[2]||''}
  else if(h)cod='ar';   // links viejos, sin país: son de Argentina
  if(cod&&PAISES[cod]&&cod!==S.pais){
    S.pais=cod;
    try{localStorage.setItem('colliers_pais',cod)}catch(e){}
  }
  if(!h)return !!cod;   // '#uy' solo: cambia de país y deja la vista como está
  if(h.toLowerCase()==='temario'){S.view='temario';S.showModal=false;return true}
  const mt=h.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!mt)return false;
  const y=+mt[1],mo=+mt[2]-1,d=+mt[3];
  if(mo<0||mo>11)return false;
  if(d<1||d>new Date(y,mo+1,0).getDate())return false;
  S.view='calendar';S.year=y;S.month=mo;S.selectedDay=d;S.showModal=false;S.editIdx=null;
  return true;
}
// replaceState no dispara hashchange: evita loops y no ensucia el historial
function syncHash(){
  let h='#'+S.pais;
  if(S.view==='calendar'&&S.selectedDay)h+='/'+dayKey(S.year,S.month,S.selectedDay);
  else if(S.view==='temario')h+='/temario';
  const url=location.pathname+location.search+h;
  if(location.pathname+location.search+location.hash!==url){
    try{history.replaceState(null,'',url)}catch(e){}
  }
}
window.addEventListener('hashchange',()=>{
  const antes=S.pais;
  if(!applyHash())return;
  if(S.pais!==antes)suscribir(); else render();
});

/* ── COMPARTIR ── */
function fmtDateLong(y,m,d){
  return `${DAYS_FULL[new Date(y,m,d).getDay()]} ${d} de ${MONTHS[m]} de ${y}`;
}
function itemToText(it){
  const L=[];
  if(it.isEvent){
    L.push(`📅 EVENTO: ${it.nombre||'Evento'}`);
    const r=getResps(it);
    if(r.length)L.push(`   A cargo: ${r.join(', ')}`);
    L.push(`   Estado: ${it.done?'Realizado':'Pendiente'}`);
  } else {
    const tema=(it.tema||'').trim();
    if(tema){
      L.push(`• ${tema}`);
      if(subtemaOf(it))L.push(`   ↳ ${subtemaOf(it)}`);
      L.push(`   ${it.tipo||'Contenido'} — ${it.area||'Sin área'}`);
    } else {
      L.push(`• ${it.tipo||'Contenido'} — ${it.area||'Sin área'}`);
    }
    const c=getCanales(it);
    if(c.length)L.push(`   Canal: ${c.join(', ')}`);
    const r=getResps(it);
    if(r.length)L.push(`   A cargo: ${r.join(', ')}`);
    L.push(`   Estado: ${it.done?'Subido':'Pendiente'}`);
  }
  const tg=getTags(it);
  if(tg.length)L.push(`   Etiquetas: ${tg.join(', ')}`);
  const d=(it.desc||'').trim();
  if(d)L.push(`   ${d.replace(/\s*\n\s*/g,' ')}`);
  const lk=hrefOf(it.link);
  if(lk)L.push(`   🔗 Contenido: ${lk}`);
  return L.join('\n');
}
function dayToText(y,m,d){
  const items=(S.data[dayKey(y,m,d)]||[]).filter(verDe);
  const done=items.filter(it=>it.done).length,pend=items.length-done;
  const fer=feriadoDe(y,m,d);
  const L=[`📅 Colliers ${pais().flag} ${pais().nombre} — Calendario de Contenidos`,fmtDateLong(y,m,d)];
  if(fer)L.push('🇦🇷 Feriado nacional: '+fer);
  L.push('');
  if(!items.length){
    L.push('Sin contenido planificado para este día.');
  } else {
    L.push(`${items.length} ${items.length===1?'ítem':'ítems'} · ${done} ${done===1?'listo':'listos'} · ${pend} ${pend===1?'pendiente':'pendientes'}`);
    L.push('──────────────────────────');
    items.forEach(it=>{L.push(itemToText(it));L.push('')});
  }
  L.push('');
  L.push(`🔗 Ver en el calendario: ${dayUrl(y,m,d)}`);
  return L.join('\n').replace(/\n{3,}/g,'\n\n');
}
function itemToShareText(y,m,d,it){
  return [`📅 Colliers ${pais().flag} ${pais().nombre} — ${fmtDateLong(y,m,d)}`,'',itemToText(it),'',`🔗 Ver en el calendario: ${dayUrl(y,m,d)}`].join('\n');
}
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=el('div','toast');t.id='toast';document.body.appendChild(t)}
  t.textContent=msg;
  clearTimeout(t._timer);
  requestAnimationFrame(()=>t.classList.add('show'));
  t._timer=setTimeout(()=>t.classList.remove('show'),2400);
}
function legacyCopy(txt){
  try{
    const ta=document.createElement('textarea');
    ta.value=txt;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:-1000px;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();ta.setSelectionRange(0,ta.value.length);
    const ok=document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){return false}
}
function copyText(txt,msg){
  const ok=()=>toast(msg||'✓ Copiado al portapapeles');
  const fail=()=>toast('No se pudo copiar. Copialo a mano.');
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(txt).then(ok).catch(()=>{legacyCopy(txt)?ok():fail()});
  } else {
    legacyCopy(txt)?ok():fail();
  }
}
function shareBtn(title,onClick){
  const b=el('button','share-btn','⧉');
  b.title=title;
  b.onclick=(e)=>{e.stopPropagation();onClick()};
  return b;
}

// 'resp' opcional: si viene, sólo cuenta lo que tiene a esa persona a cargo.
// El calendario no lo usa; es el filtro de los dashboards.
function getMonthData(y,m,resp){
  const pre=`${y}-${String(m+1).padStart(2,'0')}-`;
  let total=0,done=0,byArea={},byCanal={},byResp={};
  AREAS.forEach(a=>byArea[a]={total:0,done:0});
  CANALES.forEach(c=>byCanal[c]={total:0,done:0});
  RESPS().forEach(r=>byResp[r]={total:0,done:0});
  Object.keys(S.data).filter(k=>k.startsWith(pre)).forEach(k=>{
    (S.data[k]||[]).forEach(it=>{
      if(resp&&getResps(it).indexOf(resp)<0)return;
      total++;
      if(it.done)done++;
      if(byArea[it.area]){byArea[it.area].total++;if(it.done)byArea[it.area].done++;}
      getCanales(it).forEach(c=>{if(byCanal[c]){byCanal[c].total++;if(it.done)byCanal[c].done++;}});
      getResps(it).forEach(r=>{if(byResp[r]){byResp[r].total++;if(it.done)byResp[r].done++;}});
    });
  });
  return{total,done,pending:total-done,byArea,byCanal,byResp};
}

/* Filtro por responsable: es global, se aplica a todo lo que se muestra
   (calendario, temario, dashboards y exportación). No se aplica a las
   sugerencias ni al aviso de repetidos: esos miran siempre todo lo cargado,
   porque para no repetir contenido importa lo que hizo cualquiera. */
function verDe(it){return !S.fResp||getResps(it).indexOf(S.fResp)>=0}

function filtroResp(){
  const w=el('div','dash-filtro'+(S.fResp?' activo':''));
  w.appendChild(txt('span','dash-filtro-lbl','Ver'));
  const chips=el('div','toggle-chips');
  const mk=(val,label,color)=>{
    const on=S.fResp===val;
    const b=txt('button','toggle-chip'+(on?' active':''),label);
    b.type='button';
    if(on)b.style.cssText=`background:${color||'#25408F'};border-color:${color||'#25408F'};color:white`;
    b.onclick=()=>{S.fResp=on&&val?'':val;render()};
    chips.appendChild(b);
  };
  mk('','Todo el equipo');
  RESPS().forEach(r=>mk(r,r,respColor(r)));
  w.appendChild(chips);
  if(S.fResp){
    const q=txt('button','filtro-quitar','Mostrando sólo lo de '+S.fResp+' ✕');
    q.type='button';q.title='Volver a ver todo el equipo';
    q.onclick=()=>{S.fResp='';render()};
    w.appendChild(q);
  }
  return w;
}

/* ── PENDIENTES VENCIDOS ──
   Un día "vencido" es un día ya pasado que todavía tiene ítems sin confirmar. */
function startOfToday(){
  const n=new Date();
  return new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
}
function pendingOn(y,m,d){
  return (S.data[dayKey(y,m,d)]||[]).filter(it=>!it.done&&verDe(it)).length;
}
function isPastDay(y,m,d,sot){
  return new Date(y,m,d).getTime()<(sot===undefined?startOfToday():sot);
}

/* ── FERIADOS ──
   Se calculan solos, sin servicios externos. Los "puentes" / feriados por
   decreto no son calculables: se cargan a mano en FERIADOS_EXTRA, por país. */
const FERIADOS_EXTRA={
  // Formato: 'AAAA-MM-DD':'Motivo'
  ar:{
    // AR: feriados con fines turísticos — argentina.gob.ar/interior/feriados
    // '2026-05-08':'Feriado con fines turísticos',
  },
  uy:{
    // UY: días de asueto o feriados puntuales por decreto
    // '2026-05-08':'Asueto',
  }
};

// Domingo de Pascua (Meeus/Jones/Butcher)
function pascua(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
        f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
        h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
        l=(32+2*e+2*i-h-k)%7,mm=Math.floor((a+11*h+22*l)/451),
        mes=Math.floor((h+l-7*mm+114)/31),dia=((h+l-7*mm+114)%31)+1;
  return new Date(y,mes-1,dia);
}
function sumarDias(dt,n){const d=new Date(dt);d.setDate(d.getDate()+n);return d}

// AR — trasladables: martes y miércoles al lunes anterior; jueves y viernes al lunes siguiente
function trasladar(y,m,d){
  const dt=new Date(y,m,d),wd=dt.getDay();
  if(wd===2||wd===3)return sumarDias(dt,1-wd);
  if(wd===4||wd===5)return sumarDias(dt,8-wd);
  return dt;
}

// Argentina — Ley 27.399
function feriadosAR(y){
  const f={};
  const set=(dt,n)=>{f[dayKey(dt.getFullYear(),dt.getMonth(),dt.getDate())]=n};
  [[0,1,'Año Nuevo'],
   [2,24,'Día Nacional de la Memoria'],
   [3,2,'Día del Veterano y de los Caídos en Malvinas'],
   [4,1,'Día del Trabajador'],
   [4,25,'Día de la Revolución de Mayo'],
   [5,20,'Paso a la Inmortalidad del Gral. Belgrano'],
   [6,9,'Día de la Independencia'],
   [11,8,'Inmaculada Concepción de María'],
   [11,25,'Navidad']].forEach(([m,d,n])=>set(new Date(y,m,d),n));
  const p=pascua(y);
  set(sumarDias(p,-48),'Carnaval');
  set(sumarDias(p,-47),'Carnaval');
  set(sumarDias(p,-2),'Viernes Santo');
  set(trasladar(y,5,17),'Paso a la Inmortalidad del Gral. Güemes');
  set(trasladar(y,7,17),'Paso a la Inmortalidad del Gral. San Martín');
  set(trasladar(y,9,12),'Día del Respeto a la Diversidad Cultural');
  set(trasladar(y,10,20),'Día de la Soberanía Nacional');
  return f;
}

/* Uruguay — feriados NO laborables (los únicos en los que no se trabaja).
   Los feriados laborables (6/1, 19/4, 18/5, 19/6, 12/10 y 2/11) son días
   hábiles y por eso no se pintan. */
function feriadosUY(y){
  const f={};
  const set=(dt,n)=>{f[dayKey(dt.getFullYear(),dt.getMonth(),dt.getDate())]=n};
  [[0,1,'Año Nuevo'],
   [4,1,'Día de los Trabajadores'],
   [6,18,'Jura de la Constitución'],
   [7,25,'Declaratoria de la Independencia'],
   [11,25,'Día de la Familia']].forEach(([m,d,n])=>set(new Date(y,m,d),n));
  const p=pascua(y);
  set(sumarDias(p,-48),'Lunes de Carnaval');
  set(sumarDias(p,-47),'Martes de Carnaval');
  set(sumarDias(p,-3),'Jueves de Turismo');
  set(sumarDias(p,-2),'Viernes de Turismo');
  return f;
}

const FERIADOS_CACHE={};
function feriadosDe(y,cod){
  cod=cod||S.pais;
  const ck=cod+'-'+y;
  if(FERIADOS_CACHE[ck])return FERIADOS_CACHE[ck];
  const f=(cod==='uy')?feriadosUY(y):feriadosAR(y);
  const extra=FERIADOS_EXTRA[cod]||{};
  Object.keys(extra).forEach(k=>{if(k.indexOf(y+'-')===0)f[k]=extra[k]});
  FERIADOS_CACHE[ck]=f;
  return f;
}
function feriadoDe(y,m,d){return feriadosDe(y)[dayKey(y,m,d)]||''}

function workdaysLeft(y,m){
  const now=new Date(),last=new Date(y,m+1,0).getDate();
  const start=(y===now.getFullYear()&&m===now.getMonth())?now.getDate():1;
  let c=0;
  for(let d=start;d<=last;d++){
    const wd=new Date(y,m,d).getDay();
    if(wd&&wd<6&&!feriadoDe(y,m,d))c++;   // los feriados no son días hábiles
  }
  return c;
}

function render(){
  const root=document.getElementById('root');
  syncHash();
  document.querySelectorAll('.pais-btn').forEach(b=>b.classList.toggle('active',b.dataset.pais===S.pais));
  // Guardar el foco: un refresh de Firebase no debe cortar lo que se está tipeando
  const ae=document.activeElement,aid=ae&&ae.id?ae.id:null;
  const caret=(aid&&typeof ae.selectionStart==='number')?[ae.selectionStart,ae.selectionEnd]:null;
  root.innerHTML='';
  root.appendChild(renderTabs());
  root.appendChild(filtroResp());
  if(S.view==='calendar')root.appendChild(renderCalendar());
  else if(S.view==='temario')root.appendChild(renderTemario());
  else if(S.view==='monthly')root.appendChild(renderMonthly());
  else root.appendChild(renderAnnual());
  if(S.showModal)document.body.appendChild(renderModal());
  if(S.exportOpen)document.body.appendChild(renderExportModal());
  if(aid){
    const n=document.getElementById(aid);
    if(n&&n!==document.activeElement){
      n.focus();
      if(caret&&n.setSelectionRange)try{n.setSelectionRange(caret[0],caret[1])}catch(e){}
    }
  }
}

/* ── TEMARIO ──
   Índice buscable de todo lo cargado, para no repetir contenido.
   Se repinta solo el listado (no toda la app) para no perder el foco al tipear. */
let temResults=null;

function temFiltered(){
  const qt=norm(S.q).split(' ').filter(Boolean);
  return allItems().filter(r=>verDe(r.it)).filter(r=>{
    const it=r.it;
    if(S.fAnio&&String(r.y)!==S.fAnio)return false;
    if(S.fArea&&(it.isEvent||it.area!==S.fArea))return false;
    if(S.fCanal&&!getCanales(it).includes(S.fCanal))return false;
    if(S.fTipo==='Evento'){if(!it.isEvent)return false}
    else if(S.fTipo&&(it.isEvent||it.tipo!==S.fTipo))return false;
    if(S.fEstado==='done'&&!it.done)return false;
    if(S.fEstado==='pend'&&it.done)return false;
    if(S.fTag&&!getTags(it).some(t=>t.toLowerCase()===S.fTag.toLowerCase()))return false;
    if(qt.length){const h=haystack(r);if(!qt.every(t=>h.includes(t)))return false}
    return true;
  });
}

function groupNameOf(r){
  if(S.groupBy==='tema')return temaReal(r.it)||'Sin tema';
  if(S.groupBy==='mes')return MONTHS[r.m]+' '+r.y;
  if(S.groupBy==='area')return r.it.isEvent?'Eventos':(r.it.area||'Sin área');
  return '';
}
function temGroups(rows){
  const g=new Map();
  rows.forEach(r=>{
    const name=groupNameOf(r);
    const key=S.groupBy==='tema'?(norm(name)||name):name;
    if(!g.has(key))g.set(key,{name,list:[]});
    g.get(key).list.push(r);
  });
  const entries=[...g.values()];
  // 'mes' y 'ninguno' ya vienen ordenados por fecha.
  // Por tema: del más reciente al más antiguo. Por área (taxonomía fija): por volumen.
  if(S.groupBy==='tema')entries.sort(porMasReciente);
  else if(S.groupBy==='area')
    entries.sort((a,b)=>b.list.length-a.list.length||a.name.localeCompare(b.name,'es'));
  return entries;
}

// Ordena grupos por la fecha de calendario de su contenido más reciente
function claveMasReciente(g){return g.list.reduce((mx,r)=>r.k>mx?r.k:mx,'')}
function porMasReciente(a,b){
  const ka=claveMasReciente(a),kb=claveMasReciente(b);
  return ka<kb?1:(ka>kb?-1:a.name.localeCompare(b.name,'es'));
}

function temFilterLabels(){
  const f=[];
  if(S.q)f.push(`"${S.q}"`);
  if(S.fAnio)f.push(S.fAnio);
  if(S.fArea)f.push(S.fArea);
  if(S.fCanal)f.push(S.fCanal);
  if(S.fTipo)f.push(S.fTipo);
  if(S.fTag)f.push('#'+S.fTag);
  if(S.fEstado)f.push(S.fEstado==='done'?'sólo subidos':'sólo pendientes');
  return f;
}

// Agrupando por tema, las filas se abren en subtemas (si alguna lo tiene)
function subGroups(list){
  const g=new Map();
  list.forEach(r=>{
    const nm=subtemaOf(r.it)||'Sin subtema';
    const key=norm(nm)||nm;
    if(!g.has(key))g.set(key,{name:nm,list:[]});
    g.get(key).list.push(r);
  });
  return [...g.values()].sort(porMasReciente);
}
function pintarFilas(sec,list){
  if(S.groupBy!=='tema'||!list.some(r=>subtemaOf(r.it))){
    list.forEach(r=>sec.appendChild(temRow(r)));
    return;
  }

function paintTemario(){
  if(!temResults)return;
  temResults.innerHTML='';
  const rows=temFiltered();
  const done=rows.filter(r=>r.it.done).length;

  const head=el('div','tem-count');
  const pend=rows.length-done;
  head.appendChild(txt('span','',`${rows.length} ${rows.length===1?'ítem':'ítems'} · ${done} ${done===1?'subido':'subidos'} · ${pend} ${pend===1?'pendiente':'pendientes'}`));
  if(S.fTag){
    const chip=txt('button','tem-active-tag','#'+S.fTag+' ✕');
    chip.type='button';chip.title='Quitar filtro de etiqueta';
    chip.onclick=()=>{S.fTag='';S.temLimit=TEM_PAGE;paintTemario()};
    head.appendChild(chip);
  }
  temResults.appendChild(head);

  if(!rows.length){
    temResults.appendChild(el('p','empty-msg',
      allItems().length?'No hay contenidos que coincidan con esos filtros':'Todavía no hay contenido cargado'));
    return;
  }

  // Se recortan las filas dibujadas, no los grupos: los contadores siguen siendo reales
  let budget=S.temLimit;
  temGroups(rows).forEach(g=>{
    if(budget<=0)return;
    const sec=el('div','tem-group');
    if(S.groupBy!=='ninguno'){
      const t=el('div','tem-g-title');
      t.appendChild(txt('span','tem-g-name',g.name||'Sin dato'));
      t.appendChild(txt('span','tem-g-count',g.list.length));
      sec.appendChild(t);
    }
    const take=g.list.slice(0,budget);
    pintarFilas(sec,take);
    if(take.length<g.list.length)
      sec.appendChild(txt('div','tem-trunc',`+${g.list.length-take.length} más en este grupo`));
    budget-=take.length;
    temResults.appendChild(sec);
  });
  const shown=Math.min(S.temLimit,rows.length);
  if(rows.length>shown){
    const more=el('button','nav-btn',`Ver más (${rows.length-shown} restantes)`);
    more.style='display:block;margin:14px auto 0;padding:7px 18px;font-size:12px';
    more.onclick=()=>{S.temLimit+=TEM_PAGE;paintTemario()};
    temResults.appendChild(more);
  }
}

function temSelect(id,placeholder,options,value,set){
  const s=document.createElement('select');
  s.className='tem-input';s.id=id;
  s.innerHTML=[`<option value="">${escAttr(placeholder)}</option>`].concat(options.map(o=>{
    const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;
    return `<option value="${escAttr(v)}"${v===value?' selected':''}>${escAttr(l)}</option>`;
  })).join('');
  s.onchange=()=>{set(s.value);S.temLimit=TEM_PAGE;paintTemario()};
  return s;
}

function temarioToText(rows){
  const done=rows.filter(r=>r.it.done).length;
  const L=[`📚 Colliers ${pais().flag} ${pais().nombre} — Temario de contenidos`];
  const f=temFilterLabels();
  if(f.length)L.push('Filtros: '+f.join(' · '));
  const pend=rows.length-done;
  L.push(`${rows.length} ${rows.length===1?'ítem':'ítems'} · ${done} ${done===1?'subido':'subidos'} · ${pend} ${pend===1?'pendiente':'pendientes'}`);
  L.push('──────────────────────────');
  const fila=(r,sangria)=>{
    const it=r.it;
    const bits=[`${r.k}`];
    if(S.groupBy!=='tema')bits.push([temaOf(it),subtemaOf(it)].filter(Boolean).join(' › '));
    bits.push(it.isEvent?'Evento':`${it.tipo||'Contenido'} — ${it.area||'Sin área'}`);
    const c=getCanales(it);if(c.length)bits.push(c.join('/'));
    bits.push(it.done?(it.isEvent?'Realizado':'Subido'):'Pendiente');
    const lk=hrefOf(it.link);if(lk)bits.push(lk);
    L.push(sangria+bits.join(' · '));
  };
  temGroups(rows).forEach(g=>{
    if(S.groupBy!=='ninguno')L.push(`▸ ${g.name||'Sin dato'} (${g.list.length})`);
    if(S.groupBy==='tema'&&g.list.some(r=>subtemaOf(r.it))){
      subGroups(g.list).forEach(sg=>{
        L.push(`   ↳ ${sg.name} (${sg.list.length})`);
        sg.list.forEach(r=>fila(r,'      '));
      });
    } else {
      g.list.forEach(r=>fila(r,'   '));
    }
    L.push('');
  });
  L.push(`🔗 Temario completo: ${temarioUrl()}`);
  return L.join('\n').replace(/\n{3,}/g,'\n\n');
}

/* ── EXPORTAR MESES ──
   Arma un listado de lo calendarizado agrupado por área, para presentarle a
   cada una lo suyo. Se puede ver en pantalla, copiar, o bajar como documento
   (HTML, que se imprime o se pasa a PDF con una hoja por área) o como CSV. */
// Reusa el data URI del logo del header, sin duplicarlo en el archivo
function logoWeb(){const i=document.getElementById('brand-logo');return i?i.src:''}
function expKey(y,m){return `${y}-${String(m+1).padStart(2,'0')}`}
function expLabel(k){const pr=k.split('-');return MONTHS[+pr[1]-1]+' '+pr[0]}
function areaDe(it){return it.isEvent?'Eventos':(it.area||'Sin área')}

function expFiltrados(){
  return allItems()
    .filter(r=>verDe(r.it))
    .filter(r=>S.expMeses.indexOf(expKey(r.y,r.m))>=0)
    .filter(r=>!S.expAreas.length||S.expAreas.indexOf(areaDe(r.it))>=0)
    .sort((a,b)=>a.k<b.k?-1:(a.k>b.k?1:a.idx-b.idx));   // cronológico, como se va a presentar
}
function expGrupos(rows){
  const orden=AREAS.concat(['Eventos']),g=new Map();
  rows.forEach(r=>{
    const a=areaDe(r.it);
    if(!g.has(a))g.set(a,[]);
    g.get(a).push(r);
  });
  return [...g.entries()]
    .sort((a,b)=>{
      const ia=orden.indexOf(a[0]),ib=orden.indexOf(b[0]);
      return (ia<0?99:ia)-(ib<0?99:ib)||a[0].localeCompare(b[0],'es');
    })
    .map(e=>({nombre:e[0],list:e[1]}));
}
function expPeriodo(){
  const ms=S.expMeses.slice().sort();
  if(!ms.length)return 'Sin meses seleccionados';
  if(ms.length<=4)return ms.map(expLabel).join(' · ');
  return `${expLabel(ms[0])} — ${expLabel(ms[ms.length-1])} (${ms.length} meses)`;
}
function expNombreArchivo(ext){
  const ms=S.expMeses.slice().sort();
  const per=!ms.length?'sin-periodo':(ms.length===1?ms[0]:ms[0]+'_a_'+ms[ms.length-1]);
  const quien=S.fResp?'-'+norm(S.fResp).replace(/ /g,'-'):'';
  return `colliers-contenidos-${S.pais}${quien}-${per}.${ext}`;
}
function expFecha(r){return `${String(r.d).padStart(2,'0')}/${String(r.m+1).padStart(2,'0')}/${r.y}`}
function expEstado(it){return it.done?(it.isEvent?'Realizado':'Subido'):'Pendiente'}
function expTipo(it){return it.isEvent?'Evento':(it.tipo||'')}

function descargar(nombre,contenido,mime){
  try{
    const esTexto=typeof contenido==='string';
    const blob=new Blob([contenido],{type:mime+(esTexto?';charset=utf-8':'')});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=nombre;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000);
    toast('✓ Descargando '+nombre);
  }catch(e){toast('No se pudo descargar el archivo')}
}

// Documento para presentar: una sección por área, cada una en su hoja al imprimir
function expDocHTML(titulo){
  const rows=expFiltrados(),grupos=expGrupos(rows),e=escAttr;
  const done=rows.filter(r=>r.it.done).length;
  const hoy=new Date();
  const per=expPeriodo();
  const secciones=grupos.map(g=>{
    const gd=g.list.filter(r=>r.it.done).length;
    const filas=g.list.map(r=>{
      const it=r.it,href=hrefOf(it.link);
      return `<tr${it.done?' class="ok"':''}>`+
        `<td class="fecha">${expFecha(r)}</td>`+
        `<td><b>${e(temaOf(it))}</b></td>`+
        `<td>${e(subtemaOf(it))}</td>`+
        `<td>${e(expTipo(it))}</td>`+
        `<td>${e(getCanales(it).join(', '))}</td>`+
        `<td>${e(getResps(it).join(', '))}</td>`+
        `<td class="estado">${e(expEstado(it))}</td>`+
        `<td>${href?`<a href="${e(href)}">Ver</a>`:''}</td></tr>`;
    }).join('');

<style>
*{box-sizing:border-box;margin:0;padding:0}

.top{background:#25408F;color:#fff;padding:14px 18px;border-radius:3px;display:flex;align-items:center;gap:10px;margin-bottom:18px}

.top .per{margin-left:auto;font-size:12px;color:#C3E6FF}

.area{margin-bottom:26px}

function pdfTxt(s){
  let out='';
  for(const ch of String(s==null?'':s)){
    const c=ch.codePointAt(0);
    let b=null;
    if(c>=32&&c<=126)b=c;
    else if(c>=0xA0&&c<=0xFF)b=c;
    else if(WINANSI[c])b=WINANSI[c];
    else if(c===9||c===10)b=32;
    if(b===null)continue;
    const k=String.fromCharCode(b);
    out+=(k==='('||k===')'||k==='\\')?'\\'+k:k;
  }
  return out.replace(/ {2,}/g,' ').trim();   // si se descartó algo, no dejar huecos
}
function pdfStrU16(s){
  const esc=k=>(k==='('||k===')'||k==='\\')?'\\'+k:k;
  const par=c=>esc(String.fromCharCode((c>>8)&0xFF))+esc(String.fromCharCode(c&0xFF));
  let out='\xFE\xFF';
  for(const ch of String(s==null?'':s)){
    let c=ch.codePointAt(0);
    if(c>0xFFFF){c-=0x10000;out+=par(0xD800+(c>>10))+par(0xDC00+(c&0x3FF))}
    else out+=par(c);
  }
  return out;
}
// Anchos de Helvetica (por mil), 32..126
const HELV_W=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,
  556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,
  1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,
  667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,
  333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,
  556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
function anchoTexto(s,size,bold){
  let w=0;
  for(const ch of String(s==null?'':s)){
    const c=ch.codePointAt(0);
    if(c>=32&&c<=126)w+=HELV_W[c-32];
    else if(c>=0xC0&&c<=0xDF)w+=700;
    else if(c>=0xA0)w+=556;
  }
  return w/1000*size*(bold?1.08:1);
}
function recortar(s,maxW,size,bold){
  s=String(s==null?'':s);
  if(anchoTexto(s,size,bold)<=maxW)return s;
  while(s.length>1&&anchoTexto(s+'…',size,bold)>maxW)s=s.slice(0,-1);
  return s+'…';
}
function envolver(s,maxW,size,bold,maxLineas){
  const palabras=String(s==null?'':s).split(/\s+/).filter(Boolean);
  const out=[];let cur='';
  palabras.forEach(p=>{
    const t=cur?cur+' '+p:p;
    if(anchoTexto(t,size,bold)<=maxW){cur=t;return}
    if(cur){out.push(cur);cur=''}
    let resto=p;
    while(anchoTexto(resto,size,bold)>maxW&&resto.length>1){
      let i=resto.length-1;
      while(i>1&&anchoTexto(resto.slice(0,i),size,bold)>maxW)i--;
      out.push(resto.slice(0,i));resto=resto.slice(i);
    }
    cur=resto;
  });
  if(cur)out.push(cur);
  if(!out.length)return [''];
  if(maxLineas&&out.length>maxLineas){
    const rec=out.slice(0,maxLineas);
    rec[maxLineas-1]=recortar(rec[maxLineas-1]+'…',maxW,size,bold);
    return rec;
  }
  return out;
}
function pdfRGB(hex){
  const n=parseInt(hex.slice(1),16);
  return [((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255].map(v=>v.toFixed(3)).join(' ');
}

function expPDF(){
  const rows=expFiltrados();
  if(!rows.length){toast('No hay contenido en el período elegido');return}
  const grupos=expGrupos(rows);
  const W=841.89,H=595.28,M=36;                 // A4 apaisado: entran las 8 columnas
  const per=expPeriodo(),titulo=pais().nombre+' — Calendario de Contenidos';
  const COLS=[{t:'Fecha',w:70},{t:'Tema',w:190,bold:true,lin:2},{t:'Subtema',w:150,lin:2},
    {t:'Tipo',w:80},{t:'Canal',w:110},{t:'A cargo',w:90},{t:'Estado',w:50},{t:'Link',w:30}];
  const paginas=[];let pg=null,y=0;

  const texto=(x,top,s,size,bold,color)=>{
    pg.ops.push(`BT ${pdfRGB(color||'#000759')} rg /${bold?'F2':'F1'} ${size} Tf 1 0 0 1 ${x.toFixed(2)} ${(H-top).toFixed(2)} Tm (${pdfTxt(s)}) Tj ET`);
  };
  const rect=(x,top,w,h,color)=>{
    pg.ops.push(`${pdfRGB(color)} rg ${x.toFixed(2)} ${(H-top-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
  };
  const logoH=24,logoW=logoH*LOGO_PDF.w/LOGO_PDF.h;
  const nuevaPagina=()=>{
    pg={ops:[],links:[]};paginas.push(pg);
    rect(0,0,W,44,'#25408F');
    // el JPEG está matizado con el mismo azul, así que se funde con la barra
    pg.ops.push(`q ${logoW.toFixed(2)} 0 0 ${logoH} ${M.toFixed(2)} ${(H-10-logoH).toFixed(2)} cm /Im0 Do Q`);
    texto(M+logoW+12,27,titulo,11,true,'#FFFFFF');
    texto(W-M-anchoTexto(per,9,false),27,per,9,false,'#C3E6FF');
    y=72;
  };
  const tituloArea=(g,sigue)=>{
    texto(M,y,g.nombre.toUpperCase()+(sigue?' (cont.)':''),12,true,'#000759');
    y+=13;
    const gd=g.list.filter(r=>r.it.done).length;
    texto(M,y,`Colliers ${pais().nombre} · ${per}${S.fResp?' · A cargo de '+S.fResp:''} · ${g.list.length} ${g.list.length===1?'contenido':'contenidos'} · ${gd} ${gd===1?'listo':'listos'} · ${g.list.length-gd} ${g.list.length-gd===1?'pendiente':'pendientes'}`,8.5,false,'#7B8BBD');
    y+=6;rect(M,y,W-2*M,1.2,'#DBE5FF');y+=18;
  };
  const cabeceraTabla=()=>{
    let x=M;
    COLS.forEach(c=>{texto(x,y,c.t.toUpperCase(),7.5,true,'#56648F');x+=c.w});
    y+=5;rect(M,y,W-2*M,0.6,'#DBE5FF');y+=13;
  };

  grupos.forEach(g=>{
    nuevaPagina();tituloArea(g);cabeceraTabla();
    g.list.forEach(r=>{
      const it=r.it,href=hrefOf(it.link);
      const celdas=[[expFecha(r)],
        envolver(temaOf(it),COLS[1].w-8,9,true,2),
        envolver(subtemaOf(it),COLS[2].w-8,9,false,2),
        [recortar(expTipo(it),COLS[3].w-8,9)],
        [recortar(getCanales(it).join(', '),COLS[4].w-8,9)],
        [recortar(getResps(it).join(', '),COLS[5].w-8,9)],
        [expEstado(it)],[href?'Ver':'']];
      const nl=Math.max.apply(null,celdas.map(c=>c.length));
      const alto=13+(nl-1)*10.5;
      if(y+alto>H-42){nuevaPagina();tituloArea(g,true);cabeceraTabla()}
      let x=M;
      celdas.forEach((c,i)=>{
        const col=COLS[i];
        const color=i===0?'#1C54F4':(i===6?(it.done?'#1d8177':'#ED1B34'):(i===7?'#1C54F4':'#000759'));
        c.forEach((linea,j)=>texto(x,y+j*10.5,linea,i===0||i===6?8.5:9,!!col.bold,color));
        if(i===7&&href)
          pg.links.push({url:href,rect:[x.toFixed(2),(H-y-2).toFixed(2),(x+20).toFixed(2),(H-y+8).toFixed(2)]});
        x+=col.w;
      });
      y+=alto;
      rect(M,y-9,W-2*M,0.4,'#EEF2FB');
    });
  });

  // Pie con numeración, una vez que se sabe el total
  const hoy=new Date();
  const pie=`Generado el ${String(hoy.getDate()).padStart(2,'0')}/${String(hoy.getMonth()+1).padStart(2,'0')}/${hoy.getFullYear()}`;
  paginas.forEach((p,i)=>{
    pg=p;
    rect(M,H-34,W-2*M,0.6,'#DBE5FF');
    texto(M,H-22,pie,7.5,false,'#7B8BBD');
    const n=`Página ${i+1} de ${paginas.length}`;
    texto(W-M-anchoTexto(n,7.5,false),H-22,n,7.5,false,'#7B8BBD');
  });

  // ── Armado del archivo ──
  let id=6;const cuerpo=[],kids=[];
  const jpg=atob(LOGO_PDF.b64);
  paginas.forEach(p=>{
    const cid=++id,txtc=p.ops.join('\n');
    cuerpo.push({id:cid,s:`${cid} 0 obj\n<< /Length ${txtc.length} >>\nstream\n${txtc}\nendstream\nendobj\n`});
    const an=[];
    p.links.forEach(l=>{
      const aid=++id;an.push(aid);
      cuerpo.push({id:aid,s:`${aid} 0 obj\n<< /Type /Annot /Subtype /Link /Border [0 0 0] /Rect [${l.rect.join(' ')}] /A << /S /URI /URI (${pdfTxt(l.url)}) >> >>\nendobj\n`});
    });
    const pid=++id;kids.push(pid);
    cuerpo.push({id:pid,s:`${pid} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W.toFixed(2)} ${H.toFixed(2)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << /Im0 6 0 R >> >> /Contents ${cid} 0 R${an.length?' /Annots ['+an.map(a=>a+' 0 R').join(' ')+']':''} >>\nendobj\n`});
  });
  const dos=n=>String(n).padStart(2,'0');
  const fechaPDF=`D:${hoy.getFullYear()}${dos(hoy.getMonth()+1)}${dos(hoy.getDate())}${dos(hoy.getHours())}${dos(hoy.getMinutes())}${dos(hoy.getSeconds())}`;
  const objetos=[
    `1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n`,
    `2 0 obj\n<< /Type /Pages /Count ${kids.length} /Kids [${kids.map(k=>k+' 0 R').join(' ')}] >>\nendobj\n`,
    `3 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n`,
    `4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\nendobj\n`,
    `5 0 obj\n<< /Title (${pdfStrU16('Colliers '+titulo+' — '+per)}) /Producer (Colliers Calendario de Contenidos) /CreationDate (${fechaPDF}) >>\nendobj\n`,
    `6 0 obj\n<< /Type /XObject /Subtype /Image /Width ${LOGO_PDF.w} /Height ${LOGO_PDF.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n${jpg}\nendstream\nendobj\n`
  ].concat(cuerpo.sort((a,b)=>a.id-b.id).map(o=>o.s));

  let doc='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
  const offsets=[];
  objetos.forEach(o=>{offsets.push(doc.length);doc+=o});
  const inicioXref=doc.length;
  doc+=`xref\n0 ${objetos.length+1}\n0000000000 65535 f \n`;
  offsets.forEach(off=>{doc+=String(off).padStart(10,'0')+' 00000 n \n'});
  doc+=`trailer\n<< /Size ${objetos.length+1} /Root 1 0 R /Info 5 0 R >>\nstartxref\n${inicioXref}\n%%EOF\n`;

  const bytes=new Uint8Array(doc.length);
  for(let i=0;i<doc.length;i++)bytes[i]=doc.charCodeAt(i)&0xFF;
  descargar(expNombreArchivo('pdf'),bytes,'application/pdf');
}

/* Imprimir: el mismo documento pero en HTML, por si se quiere sacar en papel
   o guardarlo con el diálogo del navegador. */
function expImprimir(){
  const rows=expFiltrados();
  if(!rows.length){toast('No hay contenido en el período elegido');return}
  const nombre=expNombreArchivo('pdf').replace(/\.pdf$/,'');
  const tituloPrevio=document.title;
  const viejo=document.getElementById('exp-print');
  if(viejo)viejo.remove();
  const fr=document.createElement('iframe');
  fr.id='exp-print';fr.setAttribute('aria-hidden','true');
  fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(fr);
  let lanzado=false;
  const imprimir=()=>{
    if(lanzado)return;
    lanzado=true;
    try{
      document.title=nombre;
      fr.contentWindow.focus();
      fr.contentWindow.print();
    }catch(e){toast('No se pudo abrir la ventana de impresión')}
    setTimeout(()=>{document.title=tituloPrevio},2000);
  };
  try{
    const d=fr.contentWindow.document;
    d.open();d.write(expDocHTML(nombre));d.close();
    fr.onload=()=>setTimeout(imprimir,60);
    setTimeout(imprimir,350);
  }catch(e){fr.remove();toast('No se pudo abrir la ventana de impresión')}
}

function expCSV(){
  const cel=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const L=[['Fecha','País','Área','Tema','Subtema','Tipo','Canales','A cargo','Estado','Etiquetas','Link','Descripción'].map(cel).join(';')];
  expFiltrados().forEach(r=>{
    const it=r.it;
    L.push([expFecha(r),pais().nombre,areaDe(it),temaOf(it),subtemaOf(it),expTipo(it),
      getCanales(it).join(', '),getResps(it).join(', '),expEstado(it),
      getTags(it).join(', '),hrefOf(it.link),(it.desc||'').replace(/\s*\n\s*/g,' ')].map(cel).join(';'));
  });
  return '﻿'+L.join('\r\n');   // BOM: Excel abre bien los acentos
}

function expTexto(){
  const rows=expFiltrados(),done=rows.filter(r=>r.it.done).length;
  const L=[`📋 Colliers ${pais().flag} ${pais().nombre} — Calendario de Contenidos`,expPeriodo()+(S.fResp?' · A cargo de '+S.fResp:''),
    `${rows.length} ${rows.length===1?'contenido':'contenidos'} · ${done} ${done===1?'listo':'listos'} · ${rows.length-done} ${rows.length-done===1?'pendiente':'pendientes'}`,
    '──────────────────────────',''];
  expGrupos(rows).forEach(g=>{
    L.push(`▸ ${g.nombre} (${g.list.length})`);
    g.list.forEach(r=>{
      const it=r.it,bits=[expFecha(r),temaOf(it)];
      if(subtemaOf(it))bits.push('↳ '+subtemaOf(it));
      bits.push(expTipo(it));
      const c=getCanales(it);if(c.length)bits.push(c.join('/'));
      bits.push(expEstado(it));
      const lk=hrefOf(it.link);if(lk)bits.push(lk);
      L.push('   '+bits.join(' · '));
    });
    L.push('');
  });
  return L.join('\n').replace(/\n{3,}/g,'\n\n');
}

function abrirExport(){
  if(!S.expMeses.length)S.expMeses=[expKey(S.year,S.month)];
  S.expYear=S.year;
  S.exportOpen=true;
  render();
}

let expPreview=null;
function pintarExport(){
  if(!expPreview)return;
  expPreview.innerHTML='';
  const rows=expFiltrados();
  const done=rows.filter(r=>r.it.done).length;
  expPreview.appendChild(txt('div','exp-resumen',
    `${expPeriodo()} · ${rows.length} ${rows.length===1?'contenido':'contenidos'} · ${done} ${done===1?'listo':'listos'} · ${rows.length-done} ${rows.length-done===1?'pendiente':'pendientes'}`));
  if(!rows.length){
    expPreview.appendChild(el('p','empty-msg','No hay contenido calendarizado en el período elegido'));
    return;
  }
  expGrupos(rows).forEach(g=>{
    const sec=el('div','exp-area');
    const h=el('div','exp-area-title');
    h.appendChild(txt('span','exp-area-name',g.nombre));
    h.appendChild(txt('span','tem-g-count',g.list.length));
    sec.appendChild(h);
    g.list.forEach(r=>{
      const it=r.it,fila=el('div','exp-fila');
      fila.appendChild(txt('span','exp-fecha',expFecha(r)));
      const cuerpo=el('div','exp-cuerpo');
      cuerpo.appendChild(txt('div','exp-tema',temaOf(it)));
      if(subtemaOf(it))cuerpo.appendChild(txt('div','item-sub','↳ '+subtemaOf(it)));
      const meta=[expTipo(it)].concat(getCanales(it)).concat(getResps(it)).filter(Boolean);
      cuerpo.appendChild(txt('div','exp-meta',meta.join(' · ')));
      fila.appendChild(cuerpo);
      fila.appendChild(txt('span','tem-state '+(it.done?'ok':'no'),expEstado(it)));
      sec.appendChild(fila);
    });
    expPreview.appendChild(sec);
  });
}

function renderExportModal(){

  const m=el('div','modal modal-wide');
  const cerrar=()=>{S.exportOpen=false;expPreview=null;overlay.remove();render()};

  const head=el('div','modal-title');
  head.appendChild(txt('span','','Exportar contenidos'));
  const x=el('button','modal-close','✕');x.onclick=cerrar;
  head.appendChild(x);
  m.appendChild(head);

  // Selector de meses, con navegación de año
  const navY=el('div','exp-yearnav');
  const prev=el('button','nav-btn','&#8249;');
  const next=el('button','nav-btn','&#8250;');
  const lbl=txt('span','exp-year',S.expYear);
  prev.onclick=()=>{S.expYear--;lbl.textContent=S.expYear;pintarMeses()};
  next.onclick=()=>{S.expYear++;lbl.textContent=S.expYear;pintarMeses()};
  navY.appendChild(prev);navY.appendChild(lbl);navY.appendChild(next);
  const todos=el('button','exp-mini','Todo el año');
  todos.onclick=()=>{
    for(let i=0;i<12;i++){const k=expKey(S.expYear,i);if(S.expMeses.indexOf(k)<0)S.expMeses.push(k)}
    pintarMeses();pintarExport();
  };
  const nada=el('button','exp-mini','Limpiar');
  nada.onclick=()=>{S.expMeses=[];pintarMeses();pintarExport()};
  navY.appendChild(todos);navY.appendChild(nada);

  const grid=el('div','exp-meses');
  function pintarMeses(){
    grid.innerHTML='';
    for(let i=0;i<12;i++){
      const k=expKey(S.expYear,i);
      const n=Object.keys(S.data).filter(d=>d.indexOf(k+'-')===0)
        .reduce((a,d)=>a+(S.data[d]||[]).length,0);
      const b=el('button','exp-mes'+(S.expMeses.indexOf(k)>=0?' on':''));
      b.appendChild(txt('span','exp-mes-n',MONTHS[i].slice(0,3)));
      b.appendChild(txt('span','exp-mes-c',n||'—'));
      b.title=`${MONTHS[i]} ${S.expYear}: ${n} ${n===1?'contenido':'contenidos'}`;
      b.onclick=()=>{
        const p=S.expMeses.indexOf(k);
        if(p>=0)S.expMeses.splice(p,1); else S.expMeses.push(k);
        pintarMeses();pintarExport();
      };
      grid.appendChild(b);
    }
  }
  const rowMeses=el('div','form-row');
  rowMeses.appendChild(el('label','','Meses a exportar'));
  rowMeses.appendChild(navY);
  rowMeses.appendChild(grid);
  m.appendChild(rowMeses);

  // Áreas (vacío = todas)
  const rowAreas=el('div','form-row');
  rowAreas.appendChild(el('label','','Áreas <span class="label-hint">(ninguna marcada = todas)</span>'));
  const chips=el('div','toggle-chips');
  AREAS.concat(['Eventos']).forEach(a=>{
    const on=S.expAreas.indexOf(a)>=0;
    const b=txt('button','toggle-chip'+(on?' active':''),a);
    b.type='button';
    if(on)b.style.cssText='background:#25408F;border-color:#25408F;color:white';
    b.onclick=()=>{
      const p=S.expAreas.indexOf(a);
      if(p>=0){S.expAreas.splice(p,1);b.classList.remove('active');b.style.cssText=''}
      else{S.expAreas.push(a);b.classList.add('active');b.style.cssText='background:#25408F;border-color:#25408F;color:white'}
      pintarExport();
    };
    chips.appendChild(b);
  });
  rowAreas.appendChild(chips);
  m.appendChild(rowAreas);

  // Vista previa
  const rowPrev=el('div','form-row');
  rowPrev.appendChild(el('label','','Vista previa'));
  expPreview=el('div','exp-preview');
  rowPrev.appendChild(expPreview);
  m.appendChild(rowPrev);

  const btns=el('div','btn-row');
  const bp=el('button','btn-primary','⬇ PDF');
  bp.title='Documento para presentar, una hoja por área';
  bp.onclick=()=>expPDF();
  const bc=el('button','btn-primary','⬇ Excel (CSV)');
  bc.style='background:var(--c-teal)';
  bc.title='Planilla para abrir en Excel';
  bc.onclick=()=>descargar(expNombreArchivo('csv'),expCSV(),'text/csv');
  const bh=el('button','btn-share','🖨 Imprimir');
  bh.title='Abrir la ventana de impresión con el mismo documento';
  bh.onclick=()=>expImprimir();
  const bt=el('button','btn-share','⧉ Copiar');
  bt.onclick=()=>copyText(expTexto(),'✓ Listado copiado');
  btns.appendChild(bp);btns.appendChild(bc);btns.appendChild(bh);btns.appendChild(bt);
  m.appendChild(btns);
  m.appendChild(txt('div','exp-hint','El PDF baja como archivo, con una hoja por área y los links clickeables. El CSV se abre en Excel.'));

  overlay.appendChild(m);
  overlay.onclick=(ev)=>{if(ev.target===overlay)cerrar()};
  pintarMeses();
  setTimeout(pintarExport,0);
  return overlay;
}
