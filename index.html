/* Predictivo propio: aparece sólo si lo tipeado coincide con algo ya cargado
   (el <datalist> nativo volcaba la lista entera al hacer foco). Ignora
   mayúsculas y acentos, y prioriza lo que empieza igual. */
function attachSuggest(input,getOptions,termOf,applyPick){
  const wrap=el('div','sug-wrap');
  input.parentNode.insertBefore(wrap,input);
  wrap.appendChild(input);
  const box=el('div','sug-box');
  box.style.display='none';
  wrap.appendChild(box);
  let opts=[],cur=-1;

  const close=()=>{box.style.display='none';box.innerHTML='';opts=[];cur=-1};
  const mark=()=>[...box.children].forEach((c,i)=>c.classList.toggle('on',i===cur));
  const pick=(v)=>{
    input.value=applyPick(input.value,v);
    close();input.focus();
    input.dispatchEvent(new Event('input',{bubbles:true}));
  };
  const open=()=>{
    const q=norm(termOf(input.value));
    if(!q){close();return}
    const starts=[],has=[];
    getOptions().forEach(o=>{
      const n=norm(o);
      if(n===q)return;                       // ya está escrito completo
      if(n.startsWith(q))starts.push(o);
      else if(n.includes(q))has.push(o);
    });
    opts=starts.concat(has).slice(0,6);
    if(!opts.length){close();return}
    box.innerHTML='';
    opts.forEach(o=>{
      const b=txt('button','sug-item',o);
      b.type='button';
      b.onmousedown=(e)=>{e.preventDefault();pick(o)};  // antes del blur
      box.appendChild(b);
    });
    cur=-1;
    box.style.display='block';
  };

  input.addEventListener('input',open);
  input.addEventListener('focus',open);
  input.addEventListener('blur',()=>setTimeout(close,120));
  input.addEventListener('keydown',(e)=>{
    if(box.style.display==='none')return;
    if(e.key==='ArrowDown'){e.preventDefault();cur=(cur+1)%opts.length;mark()}
    else if(e.key==='ArrowUp'){e.preventDefault();cur=(cur<=0?opts.length:cur)-1;mark()}
    else if(e.key==='Enter'&&cur>=0){e.preventDefault();pick(opts[cur])}
    else if(e.key==='Escape'){e.preventDefault();close()}
  });
}

// El tema usa todo el campo; las etiquetas, sólo lo que va después de la última coma
function bindSuggests(){
  const tema=document.getElementById('fi-tema');
  if(tema)attachSuggest(tema,allTemas,v=>v,(v,p)=>p);
  const sub=document.getElementById('fi-subtema');
  if(sub)attachSuggest(sub,()=>allSubtemas(tema?tema.value:''),v=>v,(v,p)=>p);
  const tags=document.getElementById('fi-tags');
  if(tags)attachSuggest(tags,allTags,
    v=>v.split(',').pop(),
    (v,p)=>{const parts=v.split(',');parts[parts.length-1]=' '+p;return parts.join(',').replace(/^\s+/,'')+', '});
}

/* Aviso contextual bajo el subtema. Con jerarquía tema/subtema hay tres casos:
   - mismo tema y mismo subtema  → repetido de verdad (rojo)
   - mismo tema, otro subtema    → informativo: qué se cubrió ya en ese tema
   - tema parecido pero distinto → aviso de parecidos (rojo) */
function bindDupCheck(overlay){
  const temaIn=document.getElementById('fi-tema');
  const subIn=document.getElementById('fi-subtema');
  const box=document.getElementById('dup-warn');
  if(!temaIn||!box)return;
  const k=dayKey(S.year,S.month,S.selectedDay);
  const exIdx=S.editIdx===null?-1:S.editIdx;

  const irAlDia=(r)=>()=>{
    S.showModal=false;overlay.remove();S.editIdx=null;
    S.view='calendar';S.year=r.y;S.month=r.m;S.selectedDay=r.d;
    render();
  };
  const pintar=(clase,titulo,lista,etiqueta)=>{
    box.className='dup-warn'+(clase?' '+clase:'');
    box.style.display='block';
    box.innerHTML='';
    box.appendChild(txt('div','dup-warn-title',titulo));
    lista.slice(0,5).forEach(r=>{
      const b=txt('button','dup-warn-item',
        `${r.k} · ${etiqueta(r)} · ${r.it.done?'subido':'pendiente'}`);
      b.type='button';b.title='Ver ese día en el calendario';
      b.onclick=irAlDia(r);
      box.appendChild(b);
    });
  };

  const check=()=>{
    const tema=temaIn.value.trim(),sub=subIn?subIn.value.trim():'';
    box.style.display='none';box.innerHTML='';
    if(!norm(tema))return;
    const otros=allItems().filter(r=>!(r.k===k&&r.idx===exIdx));
    const mismoTema=otros.filter(r=>norm(temaReal(r.it))===norm(tema));

    if(mismoTema.length){
      const igual=norm(sub)?mismoTema.filter(r=>norm(subtemaOf(r.it))===norm(sub)):[];
      if(igual.length){
        pintar('',`⚠ Ya existe este tema con el mismo subtema (${igual.length}):`,igual,
          r=>subtemaOf(r.it)||'sin subtema');
        return;
      }
      pintar('info',
        `Ya hay ${mismoTema.length} ${mismoTema.length===1?'contenido':'contenidos'} en este tema:`,
        mismoTema,r=>subtemaOf(r.it)||'sin subtema');
      return;
    }
    const sims=similarItems(tema+' '+sub,k,exIdx);
    if(!sims.length)return;
    pintar('',`⚠ Ya hay ${sims.length} ${sims.length===1?'tema parecido':'temas parecidos'}:`,
      sims,r=>[temaOf(r.it),subtemaOf(r.it)].filter(Boolean).join(' › '));
  };

  let timer=null;
  const debounced=()=>{clearTimeout(timer);timer=setTimeout(check,180)};
  temaIn.addEventListener('input',debounced);
  if(subIn)subIn.addEventListener('input',debounced);
  check();
}

function chipRow(items,selected,colors){

  return items.map((item,i)=>{
    const on=selected.includes(item);
    const bg=colors?colors[i]:null;
    return `<button type="button" class="toggle-chip${on?' active':''}" data-val="${item}" data-bg="${bg||''}"${on&&bg?` style="background:${bg};border-color:${bg};color:white"`:''}>${item}</button>`;
  }).join('');
}

        </div>
      </div>

        <button class="btn-primary" id="fi-save">${isEdit?'Guardar cambios':'Agregar evento'}</button>
        ${isEdit?'<button class="btn-secondary" id="fi-del">Eliminar</button>':''}
      </div>`;
    overlay.appendChild(m);
    setTimeout(()=>{
      m.querySelectorAll('.toggle-chip').forEach(chip=>{
        chip.addEventListener('click',()=>{
          chip.classList.toggle('active');
          if(chip.classList.contains('active')&&chip.dataset.bg){chip.style.background=chip.dataset.bg;chip.style.borderColor=chip.dataset.bg;chip.style.color='white';}
          else{chip.style.cssText='';}
        });
      });
      bindSuggests();
      document.getElementById('mc').onclick=()=>{S.showModal=false;overlay.remove();render()};
      document.getElementById('fi-save').onclick=()=>{
        const nombre=document.getElementById('fi-nombre').value.trim()||'Evento';
        const resps=[...m.querySelectorAll('#fi-resps .toggle-chip.active')].map(c=>c.dataset.val);
        const desc=document.getElementById('fi-desc').value;
        const tags=parseTags(document.getElementById('fi-tags').value);
        const link=normalizeLink(document.getElementById('fi-link').value);
        const done=document.getElementById('fi-done').checked;
        if(!S.data[k])S.data[k]=[];
        if(isEdit)S.data[k][S.editIdx]={isEvent:true,nombre,resps,tags,desc,link,done};
        else S.data[k].push({isEvent:true,nombre,resps,tags,desc,link,done});
        save(S.data);S.showModal=false;overlay.remove();render();
      };
      const fd=document.getElementById('fi-del');
      if(fd)fd.onclick=()=>{S.data[k].splice(S.editIdx,1);if(!S.data[k].length)delete S.data[k];save(S.data);S.showModal=false;overlay.remove();S.editIdx=null;render();};
      overlay.onclick=(e)=>{if(e.target===overlay){S.showModal=false;overlay.remove();render()}};
    },30);
    return overlay;
  }
  const item=isEdit?(S.data[k]||[])[S.editIdx]:{tema:'',subtema:'',tipo:TIPOS[0],area:AREAS[0],resps:S.fResp?[S.fResp]:[],canales:[],tags:[],desc:'',link:'',done:false};

  const selResps=getResps(item);

    <div class="modal-title">
      <span>${isEdit?'Editar':'Agregar'} contenido</span>
      <button class="modal-close" id="mc">✕</button>

    <div class="modal-date">${S.selectedDay} de ${MONTHS[S.month]} ${S.year}${avisoFeriado()}</div><br>

      <label>Subtema <span class="label-hint">(opcional)</span></label>
      <input type="text" id="fi-subtema" placeholder="Ej: Qué es la vacancia" value="${escAttr(item.subtema||'')}" autocomplete="off">
      <div class="dup-warn" id="dup-warn" style="display:none"></div>
    </div>
    <div class="form-row">
      <label>Tipo de contenido</label>
      <select id="fi-tipo">${TIPOS.map(t=>`<option${t===item.tipo?' selected':''}>${t}</option>`).join('')}</select>
    </div>
    <div class="form-row">
      <label>Área de la empresa</label>
      <select id="fi-area">${AREAS.map(a=>`<option${a===item.area?' selected':''}>${a}</option>`).join('')}</select>
    </div>
    <div class="form-row">
      <label>Responsable</label>
      <div class="toggle-chips" id="fi-resps">${chipRow(RESPS(),selResps,RESP_COLORS)}</div>
    </div>
    <div class="form-row">
      <label>Canal / Sitio</label>
      <div class="toggle-chips" id="fi-canales">${chipRow(CANALES,selCanales,Object.values(CANAL_BG))}</div>
    </div>
    <div class="form-row">
      <label>Descripción</label>

    </div>

    </div>
    <div class="form-row">
      <label>Link del contenido</label>

    </div>
    <div class="form-row">

      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="fi-save">${isEdit?'Guardar cambios':'Agregar'}</button>
      ${isEdit?'<button class="btn-secondary" id="fi-del">Eliminar</button>':''}
    </div>`;
  overlay.appendChild(m);
  setTimeout(()=>{
    m.querySelectorAll('.toggle-chip').forEach(chip=>{
      chip.addEventListener('click',()=>{
        chip.classList.toggle('active');
        if(chip.classList.contains('active')&&chip.dataset.bg){
          chip.style.background=chip.dataset.bg;
          chip.style.borderColor=chip.dataset.bg;
          chip.style.color='white';
        } else {
          chip.style.cssText='';
        }
      });
    });
    document.getElementById('mc').onclick=()=>{S.showModal=false;overlay.remove();render()};
    bindSuggests();
    bindDupCheck(overlay);
    document.getElementById('fi-save').onclick=()=>{
      const tema=document.getElementById('fi-tema').value.trim();
      const subtema=document.getElementById('fi-subtema').value.trim();
      const tags=parseTags(document.getElementById('fi-tags').value);
      const tipo=document.getElementById('fi-tipo').value;
      const area=document.getElementById('fi-area').value;
      const resps=[...m.querySelectorAll('#fi-resps .toggle-chip.active')].map(c=>c.dataset.val);
      const canales=[...m.querySelectorAll('#fi-canales .toggle-chip.active')].map(c=>c.dataset.val);
      const desc=document.getElementById('fi-desc').value;
      const link=normalizeLink(document.getElementById('fi-link').value);
      const done=document.getElementById('fi-done').checked;
      if(!S.data[k])S.data[k]=[];
      if(isEdit)S.data[k][S.editIdx]={tema,subtema,tipo,area,resps,canales,tags,desc,link,done};
      else S.data[k].push({tema,subtema,tipo,area,resps,canales,tags,desc,link,done});
      save(S.data);S.showModal=false;overlay.remove();render();
    };
    const fd=document.getElementById('fi-del');
    if(fd)fd.onclick=()=>{
      S.data[k].splice(S.editIdx,1);
      if(!S.data[k].length)delete S.data[k];

    };
    overlay.onclick=(e)=>{if(e.target===overlay){S.showModal=false;overlay.remove();render()}};

  return overlay;
